name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "IPA export method (used only when signing secrets are configured)"
        required: false
        default: development
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
  push:
    branches: [main]
    paths:
      - "Snap/**"
      - "project.yml"
      - ".github/workflows/build-ios.yml"
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: Snap.xcodeproj
  SCHEME: Snap
  BUNDLE_ID: com.tao.Snap
  SNAP_DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

jobs:
  build:
    name: Archive and export IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          test -d "$PROJECT"

      - name: Decide signing mode
        id: signing
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "${P12_BASE64}" ] && [ -n "${PROFILE_BASE64}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing material found: will build a signed IPA."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets: will build an unsigned (re-signable) IPA."
          fi

      # ------------------------------------------------------------------
      # Signed path: requires SIGNING_CERTIFICATE_P12_BASE64,
      # SIGNING_CERTIFICATE_PASSWORD, PROVISIONING_PROFILE_BASE64,
      # DEVELOPMENT_TEAM and optionally PROVISIONING_PROFILE_SPECIFIER.
      # ------------------------------------------------------------------
      - name: Import signing material
        if: steps.signing.outputs.enabled == 'true'
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/snap-build.keychain-db"
          KEYCHAIN_PASSWORD="snap-ci-$(date +%s)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/snap.mobileprovision"
          ls -l "$PROFILE_DIR"

      - name: Archive (signed)
        if: steps.signing.outputs.enabled == 'true'
        env:
          PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ -n "${PROFILE_SPECIFIER:-}" ]; then
            EXTRA="PROVISIONING_PROFILE_SPECIFIER=$PROFILE_SPECIFIER"
          fi
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Snap.xcarchive" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${SNAP_DEVELOPMENT_TEAM}" \
            $EXTRA \
            clean archive

      - name: Export signed IPA
        if: steps.signing.outputs.enabled == 'true'
        env:
          EXPORT_METHOD: ${{ inputs.export_method || 'development' }}
          PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${SNAP_DEVELOPMENT_TEAM}</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_SPECIFIER}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Snap.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates

          test -f "$RUNNER_TEMP/export/Snap.ipa"
          cp "$RUNNER_TEMP/export/Snap.ipa" "$GITHUB_WORKSPACE/Snap.ipa"
          echo "IPA_PATH=$GITHUB_WORKSPACE/Snap.ipa" >> "$GITHUB_ENV"
          echo "IPA_KIND=signed" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # Unsigned path: no Apple credentials required. The resulting IPA is
      # a valid archive but must be re-signed (e.g. AltStore / Sideloadly)
      # before it can be installed on a device.
      # ------------------------------------------------------------------
      - name: Build app without signing
        if: steps.signing.outputs.enabled != 'true'
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            clean build

          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Snap.app"
          test -d "$APP"

          STAGE="$RUNNER_TEMP/ipa-stage"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/Snap.app"
          (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/Snap-unsigned.ipa" Payload)

          echo "IPA_PATH=$GITHUB_WORKSPACE/Snap-unsigned.ipa" >> "$GITHUB_ENV"
          echo "IPA_KIND=unsigned" >> "$GITHUB_ENV"

      - name: Verify and summarize IPA
        run: |
          set -euo pipefail
          test -f "$IPA_PATH"
          unzip -t "$IPA_PATH" > /dev/null
          SHA=$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')
          SIZE=$(du -h "$IPA_PATH" | awk '{print $1}')
          echo "SHA-256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kind | $IPA_KIND |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | $SIZE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${GITHUB_SHA} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$IPA_PATH" | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snap-IPA-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Snap build ${{ github.run_number }}
          body: |
            Cloud build of `Snap` from commit `${{ github.sha }}`.
            IPA kind: `${{ env.IPA_KIND }}`.
          files: ${{ env.IPA_PATH }}
          fail_on_unmatched_files: true
