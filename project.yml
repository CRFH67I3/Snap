name: Snap

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set your own Apple Developer Team before generating the project:
    #   export SNAP_DEVELOPMENT_TEAM=XXXXXXXXXX && xcodegen generate
    # Leaving it empty still generates a valid project; pick your team in
    # Xcode under Signing & Capabilities instead.
    DEVELOPMENT_TEAM: ${SNAP_DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"

schemes:
  Snap:
    build:
      targets:
        Snap: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  Snap:
    type: application
    platform: iOS
    sources:
      - path: Snap
    info:
      path: Snap/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Snap 需要读取相册中的截图，才能把它们拼接成一张长截图。"
        NSPhotoLibraryAddUsageDescription: "Snap 会把拼接好的长截图保存回你的相册。"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tao.Snap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
